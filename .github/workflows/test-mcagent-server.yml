name: Test MCAgent Server

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-mcagent-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install server dependencies
        working-directory: services/mcagent-server
        run: python -m pip install -e ".[dev]"

      - name: Run server tests
        working-directory: services/mcagent-server
        run: python -m pytest -q
