name: Alpha UI/UX feedback
description: Share focused feedback about the Desktop or Web alpha interface.
title: "[UX]: "
body:
  - type: markdown
    attributes:
      value: Do not include private paths, account details, secrets, or unredacted screenshots.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop Shell
        - Web Playground
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or tag
      placeholder: v0.1-alpha-preview
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and context
      description: Describe what you were trying to accomplish and the screen involved.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Usability problem
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility or responsive-layout impact
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: Any screenshots or logs are redacted and contain no secrets, complete local paths, or private identifiers.
          required: true
