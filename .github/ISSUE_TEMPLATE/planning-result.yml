name: Alpha planning result feedback
description: Report an intent, resource-plan, or resource-resolution mismatch.
title: "[Planning]: "
body:
  - type: markdown
    attributes:
      value: Redact the prompt and plan excerpts. Do not upload a full environment report, resource binary, token, or complete local path.
  - type: textarea
    id: prompt
    attributes:
      label: Redacted user prompt
      description: Remove personal or unrelated information.
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: 1.20.1
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader
      placeholder: fabric
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected mods or features
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual plan summary
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: networkUsed
      options:
        - "false"
        - "true"
        - unknown
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted warnings or errors
      render: text
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I removed secrets, private paths, identifiers, and full environment reports.
          required: true
